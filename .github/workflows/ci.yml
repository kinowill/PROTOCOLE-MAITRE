name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Versions des outils
        run: |
          node --version
          git --version
          $PSVersionTable.PSVersion.ToString()
      - name: Structure, UTF-8 et syntaxe
        run: ./tools/validate.ps1
      - name: Tests de sécurité et d'installation
        run: node tests/tools.test.mjs
      - name: Tests du suivi OpenCode isolé
        run: node tests/context.test.mjs
      - name: Tests des fins de ligne et du périmètre de validation
        run: node tests/validate.test.mjs
      - name: Audit des fichiers suivis sans exclusions
        run: ./tools/pre-push-audit.ps1
