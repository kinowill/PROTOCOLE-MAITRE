name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Versions des outils
        run: |
          node --version
          git --version
          $PSVersionTable.PSVersion.ToString()
      - name: Structure, UTF-8 et syntaxe
        run: ./tools/validate.ps1
      - name: Tests de sécurité et d'installation
        run: node tests/tools.test.mjs
      - name: Tests du suivi OpenCode isolé
        run: node tests/context.test.mjs
      - name: Tests des fins de ligne et du périmètre de validation
        run: node tests/validate.test.mjs
      - name: Audit des fichiers suivis sans exclusions
        run: ./tools/pre-push-audit.ps1
